# Konfiguracja Pages CMS (https://pagescms.org) — panel do pisania wpisów w przeglądarce.
media:
  input: public/images
  output: /images

content:
  - name: blog
    label: Blog
    type: collection
    path: src/content/blog
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, category, draft]
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tytuł
        description: "Raporty: „Raport AI: daty — 3 hasła tematyczne”, do ok. 60 znaków. Artykuły: główne słowo kluczowe na początku."
        type: string
        required: true
      - name: description
        label: Opis (lead, 1–2 zdania)
        description: "140–155 znaków, z nazwami własnymi (firmy, modele, kraje), które ktoś wpisze w wyszukiwarkę."
        type: text
        required: true
      - name: date
        label: Data publikacji
        type: date
        required: true
      - name: category
        label: Kategoria
        type: select
        default: artykul
        options:
          values:
            - value: artykul
              label: Artykuł
            - value: raport-ai
              label: Raport AI
            - value: raport-gaming
              label: Raport Gaming
      - name: tags
        label: Tagi
        type: string
        list: true
      - name: draft
        label: Szkic (nie publikuj jeszcze)
        type: boolean
        default: true
      - name: linkedin
        label: Skrót na LinkedIn (nie pojawia się na stronie)
        type: text
      - name: body
        label: Treść
        type: rich-text

  - name: konferencje
    label: Kalendarz konferencji
    type: file
    path: src/data/konferencje.json
    format: json
    fields:
      - name: aktualizacja
        label: Data ostatniej aktualizacji (RRRR-MM-DD)
        type: string
      - name: wydarzenia
        label: Wydarzenia
        type: object
        list: true
        fields:
          - { name: nazwa, label: Nazwa, type: string, required: true }
          - name: branza
            label: Branża
            type: select
            default: ai-tech
            options:
              values:
                - { value: gaming, label: Gaming i loterie }
                - { value: ai-tech, label: AI i technologie }
          - { name: od, label: Od (RRRR-MM-DD), type: string, required: true }
          - { name: do, label: Do (RRRR-MM-DD), type: string, required: true }
          - { name: miasto, label: Miasto, type: string }
          - { name: kraj, label: Kraj, type: string }
          - name: region
            label: Region
            type: select
            options:
              values: [Europa, Ameryka Płn., Ameryka Płd., Afryka, Azja, Bliski Wschód, Oceania, Online]
          - { name: obiekt, label: Obiekt / centrum targowe, type: string }
          - { name: organizator, label: Organizator, type: string }
          - { name: url, label: Strona wydarzenia, type: string, required: true }
          - name: tagi
            label: Tematy
            type: select
            options:
              multiple: true
              values: [iGaming, Kasyna, Zakłady, Loterie, Regulacje, Afiliacja, Nagrody, AI biznes, Badania, Deweloperzy, Data, Startupy, Cyberbezpieczeństwo]
          - name: status
            label: Skąd data
            type: select
            default: organizator
            options:
              values:
                - { value: organizator, label: Potwierdzona u organizatora }
                - { value: agregator, label: Z agregatora }
          - { name: zrodlo, label: Link do źródła daty, type: string }
          - { name: uwaga, label: Uwaga (opcjonalnie), type: string }
          - { name: cfp, label: Koniec naboru prelegentów CFP (RRRR-MM-DD; opcjonalnie), type: string }
          - { name: cfpUrl, label: Link do zgłoszeń CFP (opcjonalnie), type: string }
